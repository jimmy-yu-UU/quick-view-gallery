name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decrypt signing key
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::warning::Secret SIGNING_PASSWORD is not set: building with the debug key and not publishing."
            exit 0
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in app/signing/release.keystore.enc -out "$RUNNER_TEMP/release.keystore" -pass env:SIGNING_PASSWORD
          echo "QV_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "QV_SIGNING_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "HAS_RELEASE_KEY=true" >> "$GITHUB_ENV"

      - name: Release notes
        run: |
          # Every commit message since the previous release, in English and Chinese.
          PREV=$(git tag --list 'v*' --sort=-v:refname | head -1)
          python3 .github/scripts/release_notes.py "${PREV:+$PREV..}HEAD" "${{ github.sha }}" "$PREV" > notes.md
          cat notes.md
          mkdir -p app/src/main/assets
          cp notes.md app/src/main/assets/release_notes.md

      - name: Build release APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --warning-mode=none 2>&1 | tee build.log

      # Publishing happens in release.yml, after the UI test and SonarCloud have passed.
      - name: Keep APK for the UI test and release
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Keep release notes
        run: |
          mkdir -p release-meta
          cp notes.md release-meta/
          echo "1.0.${{ github.run_number }}" > release-meta/version.txt
          echo "${HAS_RELEASE_KEY:-false}" > release-meta/signed.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-meta
          path: release-meta/
          retention-days: 14

      - name: Publish log
        if: always()
        run: |
          mkdir -p ci && cd ci
          echo "run=${{ github.run_number }} sha=${{ github.sha }} status=${{ job.status }} signed=${HAS_RELEASE_KEY:-false}" > status.txt
          if [ -f ../build.log ]; then
            grep -nE '^e: |error:|::error::|What went wrong|FAILURE|BUILD' ../build.log | head -300 > errors.txt || true
            tail -200 ../build.log > tail.txt
          fi
          git init -q && git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:ci-logs
