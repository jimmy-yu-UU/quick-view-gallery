name: release
# Publishes a build only after its UI test passed and the SonarCloud quality gate is green.
on:
  workflow_run:
    workflows: [ui-test]
    types: [completed]

permissions:
  contents: write
  actions: read
  checks: read

jobs:
  release:
    # A skipped UI test (e.g. its build was cancelled) has nothing to release.
    if: ${{ github.event.workflow_run.conclusion != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Find the build of this commit
        id: build
        run: |
          RUN=$(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?head_sha=$SHA&status=success" --jq '.workflow_runs[0].id')
          MSG=$(gh api "repos/${{ github.repository }}/commits/$SHA" --jq '.commit.message')
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          if echo "$MSG" | grep -q '\[wip\]'; then echo "wip=true" >> "$GITHUB_OUTPUT"; fi
          echo "build run: $RUN"

      - name: Wait for SonarCloud quality gate
        if: steps.build.outputs.wip != 'true' && github.event.workflow_run.conclusion == 'success'
        run: |
          for i in $(seq 1 80); do
            R=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" \
                --jq '[.check_runs[] | select(.name | startswith("SonarCloud"))][0] | "\(.status) \(.conclusion)"')
            echo "SonarCloud: $R"
            case "$R" in
              "completed success") exit 0 ;;
              completed*) echo "::error::SonarCloud quality gate did not pass ($R); not releasing."; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::SonarCloud result did not arrive in time; not releasing."
          exit 1

      - uses: actions/download-artifact@v4
        if: steps.build.outputs.wip != 'true' && github.event.workflow_run.conclusion == 'success'
        with:
          name: apk
          run-id: ${{ steps.build.outputs.run }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        if: steps.build.outputs.wip != 'true' && github.event.workflow_run.conclusion == 'success'
        with:
          name: release-meta
          run-id: ${{ steps.build.outputs.run }}
          github-token: ${{ github.token }}

      - name: Publish release
        if: steps.build.outputs.wip != 'true' && github.event.workflow_run.conclusion == 'success'
        run: |
          VERSION=$(cat version.txt)
          if [ "$(cat signed.txt)" != "true" ]; then echo "::error::Build was not signed with the release key."; exit 1; fi
          if gh release view "v$VERSION" -R "${{ github.repository }}" >/dev/null 2>&1; then echo "v$VERSION already released"; exit 0; fi
          cp app-release.apk "QVGallery-$VERSION.apk"
          gh release create "v$VERSION" "QVGallery-$VERSION.apk" -R "${{ github.repository }}" \
            --target "$SHA" --title "QV Gallery $VERSION" --notes-file notes.md --latest
