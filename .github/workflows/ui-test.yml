name: ui-test
on:
  workflow_run:
    workflows: [build]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ui-test:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern '*.apk' --output app.apk --clobber

      - name: Test tools
        run: |
          pip install --quiet pillow pillow-heif
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 .github/scripts/ui_test.py app.apk

      - name: Publish results
        if: always()
        run: |
          mkdir -p out && cd out
          echo "run=${{ github.run_number }} sha=${{ github.sha }} status=${{ job.status }}" > status.txt
          git init -q && git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "ui-test ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:ci-test
