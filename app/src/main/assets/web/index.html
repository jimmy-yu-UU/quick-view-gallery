<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QV Gallery</title>
<style>
  :root { --bg:#111318; --card:#1d2027; --fg:#e3e2e9; --dim:#9aa0ad; --accent:#8fa3ff; --err:#ff8a80; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f6fb; --card:#fff; --fg:#1b1b21; --dim:#5d6170; --accent:#3f51b5; --err:#c62828; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans TC","Noto Sans JP",sans-serif; background:var(--bg); color:var(--fg); }
  header { position:sticky; top:0; z-index:5; display:flex; gap:12px; align-items:center; padding:12px 16px; background:var(--card); box-shadow:0 1px 4px #0004; }
  header h1 { font-size:18px; margin:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  button, .btn { background:var(--accent); color:#fff; border:0; border-radius:20px; padding:8px 16px; font-size:14px; cursor:pointer; text-decoration:none; white-space:nowrap; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button:disabled { opacity:.4; cursor:default; }
  main { padding:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:6px; }
  .tile { position:relative; aspect-ratio:1; background:#0003; border-radius:6px; overflow:hidden; cursor:pointer; }
  .tile img { width:100%; height:100%; object-fit:cover; display:block; }
  .tile .cap { position:absolute; left:0; right:0; bottom:0; padding:18px 8px 6px; color:#fff; background:linear-gradient(transparent,#000b); font-size:13px; }
  .tile .badge { position:absolute; right:6px; bottom:6px; background:#000a; color:#fff; font-size:11px; padding:1px 5px; border-radius:4px; }
  .tile input { position:absolute; top:6px; left:6px; width:20px; height:20px; accent-color:var(--accent); }
  .tile.sel { outline:3px solid var(--accent); outline-offset:-3px; }
  #login { max-width:340px; margin:12vh auto; background:var(--card); padding:28px; border-radius:16px; text-align:center; }
  #login input { width:100%; font-size:28px; letter-spacing:8px; text-align:center; padding:10px; margin:16px 0; border-radius:10px; border:1px solid var(--dim); background:var(--bg); color:var(--fg); }
  .msg { color:var(--err); min-height:1.2em; }
  .dim { color:var(--dim); font-size:13px; }
  #viewer { position:fixed; inset:0; background:#000e; display:none; z-index:10; align-items:center; justify-content:center; flex-direction:column; }
  #viewer img, #viewer video { max-width:100vw; max-height:calc(100vh - 64px); }
  #viewer .bar { position:absolute; top:0; left:0; right:0; display:flex; gap:8px; align-items:center; padding:10px; color:#fff; background:linear-gradient(#000a,transparent); }
  #viewer .bar span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #viewer .nav { position:absolute; top:50%; font-size:40px; color:#fff; background:none; padding:12px; }
  #drop { position:fixed; inset:0; background:#3f51b5cc; color:#fff; font-size:28px; display:none; align-items:center; justify-content:center; z-index:20; }
  #uploads { position:fixed; right:12px; bottom:12px; width:300px; max-height:50vh; overflow:auto; background:var(--card); border-radius:12px; box-shadow:0 2px 12px #0006; padding:10px; display:none; z-index:8; }
  #uploads .row { font-size:13px; margin:6px 0; }
  progress { width:100%; height:6px; }
</style>
</head>
<body>
<div id="login">
  <h2>QV Gallery</h2>
  <div class="dim" id="t-code-hint"></div>
  <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" autofocus>
  <div class="msg" id="loginMsg"></div>
  <button id="loginBtn"></button>
</div>
<div id="app" style="display:none">
  <header>
    <button class="ghost" id="backBtn" style="display:none">←</button>
    <h1 id="title">QV Gallery</h1>
    <button class="ghost" id="selAllBtn" style="display:none"></button>
    <button id="dlBtn" style="display:none"></button>
    <button id="upBtn"></button>
    <input type="file" id="fileInput" multiple accept="image/*,video/*" style="display:none">
  </header>
  <main><div class="dim" id="sub"></div><div class="grid" id="grid"></div></main>
</div>
<div id="viewer">
  <div class="bar"><button class="ghost" id="vClose">✕</button><span id="vName"></span><a class="btn" id="vDl"></a></div>
  <button class="nav" id="vPrev" style="left:0">‹</button>
  <div id="vBody"></div>
  <button class="nav" id="vNext" style="right:0">›</button>
</div>
<div id="drop"></div>
<div id="uploads"></div>
<form id="zipForm" method="POST" action="/api/zip" style="display:none"><input name="paths"></form>
<script>
const I18N = {
  en: { codeHint:"Enter the 6-digit pairing code shown on the phone", login:"Connect", wrong:"Wrong code", locked:"Too many attempts, try again in a minute", fail:"Connection failed",
        albums:"Albums", items:n=>`${n} items`, upload:"Upload", download:sel=>sel?`Download ${sel} (ZIP)`:"Download album (ZIP)", selectAll:"Select all", none:"Select none",
        drop:"Drop photos or videos to upload", uploading:"Uploading", done:"Done", failed:"Failed", save:"Download", empty:"No photos here" },
  "zh-TW": { codeHint:"請輸入手機上顯示的 6 位數配對碼", login:"連線", wrong:"配對碼錯誤", locked:"嘗試次數過多，請一分鐘後再試", fail:"連線失敗",
        albums:"相簿", items:n=>`${n} 個項目`, upload:"上傳", download:sel=>sel?`下載 ${sel} 個 (ZIP)`:"下載整本相簿 (ZIP)", selectAll:"全選", none:"取消全選",
        drop:"放開以上傳相片或影片", uploading:"上傳中", done:"完成", failed:"失敗", save:"下載", empty:"這裡沒有相片" },
  "zh-CN": { codeHint:"请输入手机上显示的 6 位配对码", login:"连接", wrong:"配对码错误", locked:"尝试次数过多，请一分钟后再试", fail:"连接失败",
        albums:"相册", items:n=>`${n} 个项目`, upload:"上传", download:sel=>sel?`下载 ${sel} 个 (ZIP)`:"下载整个相册 (ZIP)", selectAll:"全选", none:"取消全选",
        drop:"松开以上传照片或视频", uploading:"上传中", done:"完成", failed:"失败", save:"下载", empty:"这里没有照片" },
  ja: { codeHint:"スマートフォンに表示されている 6 桁のペア設定コードを入力してください", login:"接続", wrong:"コードが違います", locked:"試行回数が多すぎます。1 分後にお試しください", fail:"接続できませんでした",
        albums:"アルバム", items:n=>`${n} 件`, upload:"アップロード", download:sel=>sel?`${sel} 件をダウンロード (ZIP)`:"アルバムをダウンロード (ZIP)", selectAll:"すべて選択", none:"選択解除",
        drop:"ドロップして写真や動画をアップロード", uploading:"アップロード中", done:"完了", failed:"失敗", save:"ダウンロード", empty:"写真がありません" },
};
const lang = (navigator.language || "en");
const T = I18N[lang] || I18N[lang.startsWith("zh") ? (/(CN|SG|Hans)/i.test(lang) ? "zh-CN" : "zh-TW") : lang.split("-")[0]] || I18N.en;
const $ = id => document.getElementById(id);
let token = sessionStorage.getItem("qvt") || "";
let album = null, items = [], selected = new Set(), current = -1;

$("t-code-hint").textContent = T.codeHint; $("loginBtn").textContent = T.login; $("upBtn").textContent = T.upload;
$("drop").textContent = T.drop; $("vDl").textContent = T.save;

async function api(path, opts = {}) {
  opts.headers = Object.assign({ "X-QV-Token": token }, opts.headers || {});
  const r = await fetch(path, opts);
  if (r.status === 401) { showLogin(); throw new Error("unauthorized"); }
  return r;
}
function showLogin() { $("app").style.display = "none"; $("login").style.display = "block"; $("code").focus(); }
async function login() {
  $("loginMsg").textContent = "";
  try {
    const r = await fetch("/api/login", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ code: $("code").value.trim() }) });
    if (r.status === 403) { $("loginMsg").textContent = T.wrong; return; }
    if (r.status === 429) { $("loginMsg").textContent = T.locked; return; }
    const j = await r.json(); token = j.token; sessionStorage.setItem("qvt", token);
    $("login").style.display = "none"; $("app").style.display = "block"; showAlbums();
  } catch (e) { $("loginMsg").textContent = T.fail; }
}
$("loginBtn").onclick = login;
$("code").addEventListener("keydown", e => { if (e.key === "Enter") login(); });

const thumb = p => "/api/thumb?path=" + encodeURIComponent(p) + "&t=" + token;
const fileUrl = (p, dl) => "/api/file?path=" + encodeURIComponent(p) + (dl ? "&dl=1" : "") + "&t=" + token;

async function showAlbums() {
  album = null; selected.clear(); updateBar();
  $("title").textContent = T.albums; $("backBtn").style.display = "none";
  const list = await (await api("/api/albums")).json();
  $("sub").textContent = "";
  $("grid").innerHTML = "";
  for (const a of list) {
    const d = document.createElement("div"); d.className = "tile";
    d.innerHTML = `<img loading="lazy" src="${thumb(a.cover)}"><div class="cap"><b></b><br>${a.count}</div>`;
    d.querySelector("b").textContent = a.name;
    d.onclick = () => openAlbum(a);
    $("grid").appendChild(d);
  }
}
async function openAlbum(a) {
  album = a; selected.clear();
  $("title").textContent = a.name; $("backBtn").style.display = "";
  items = await (await api("/api/media?album=" + encodeURIComponent(a.path))).json();
  $("sub").textContent = items.length ? T.items(items.length) : T.empty;
  $("grid").innerHTML = "";
  items.forEach((m, i) => {
    const d = document.createElement("div"); d.className = "tile";
    d.innerHTML = `<img loading="lazy" src="${thumb(m.path)}"><input type="checkbox">` + (m.video ? `<span class="badge">▶</span>` : "");
    const cb = d.querySelector("input");
    cb.onclick = e => { e.stopPropagation(); cb.checked ? selected.add(m.path) : selected.delete(m.path); d.classList.toggle("sel", cb.checked); updateBar(); };
    d.onclick = () => openViewer(i);
    $("grid").appendChild(d);
  });
  updateBar();
}
function updateBar() {
  const inAlbum = !!album;
  $("dlBtn").style.display = inAlbum ? "" : "none";
  $("selAllBtn").style.display = inAlbum ? "" : "none";
  $("dlBtn").textContent = selected.size === 1 ? T.save : T.download(selected.size);
  $("selAllBtn").textContent = selected.size === items.length && items.length ? T.none : T.selectAll;
}
$("backBtn").onclick = showAlbums;
$("selAllBtn").onclick = () => {
  const all = selected.size !== items.length;
  selected = new Set(all ? items.map(m => m.path) : []);
  document.querySelectorAll("#grid .tile").forEach(t => { const c = t.querySelector("input"); c.checked = all; t.classList.toggle("sel", all); });
  updateBar();
};
$("dlBtn").onclick = () => {
  if (selected.size === 0) { location.href = "/api/zip?album=" + encodeURIComponent(album.path) + "&t=" + token; return; }
  if (selected.size === 1) { location.href = fileUrl([...selected][0], true); return; }
  const f = $("zipForm"); f.action = "/api/zip?t=" + token + "&album=" + encodeURIComponent(album.path);
  f.paths.value = JSON.stringify([...selected]); f.submit();
};

function openViewer(i) {
  current = i; const m = items[i]; if (!m) return;
  $("viewer").style.display = "flex"; $("vName").textContent = m.name; $("vDl").href = fileUrl(m.path, true);
  $("vBody").innerHTML = m.video ? `<video controls autoplay src="${fileUrl(m.path)}"></video>` : `<img src="${fileUrl(m.path)}">`;
}
$("vClose").onclick = () => { $("viewer").style.display = "none"; $("vBody").innerHTML = ""; };
$("vPrev").onclick = () => current > 0 && openViewer(current - 1);
$("vNext").onclick = () => current < items.length - 1 && openViewer(current + 1);
document.addEventListener("keydown", e => {
  if ($("viewer").style.display !== "flex") return;
  if (e.key === "Escape") $("vClose").onclick(); if (e.key === "ArrowLeft") $("vPrev").onclick(); if (e.key === "ArrowRight") $("vNext").onclick();
});

// Uploads: raw PUT per file so the phone can stream straight to storage.
$("upBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = e => { uploadAll([...e.target.files]); e.target.value = ""; };
let dragDepth = 0;
addEventListener("dragenter", e => { e.preventDefault(); if (token) { dragDepth++; $("drop").style.display = "flex"; } });
addEventListener("dragleave", e => { if (--dragDepth <= 0) { dragDepth = 0; $("drop").style.display = "none"; } });
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => { e.preventDefault(); dragDepth = 0; $("drop").style.display = "none"; if (token) uploadAll([...e.dataTransfer.files]); });
async function uploadAll(files) {
  if (!files.length) return;
  $("uploads").style.display = "block";
  for (const f of files) {
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = `<div></div><progress max="100" value="0"></progress>`;
    row.firstChild.textContent = `${T.uploading}: ${f.name}`;
    $("uploads").prepend(row);
    const ok = await new Promise(res => {
      const x = new XMLHttpRequest();
      x.open("PUT", "/api/upload?name=" + encodeURIComponent(f.name));
      x.setRequestHeader("X-QV-Token", token);
      x.upload.onprogress = ev => { if (ev.lengthComputable) row.lastChild.value = ev.loaded * 100 / ev.total; };
      x.onload = () => res(x.status === 200); x.onerror = () => res(false);
      x.send(f);
    });
    row.firstChild.textContent = `${ok ? T.done : T.failed}: ${f.name}`;
    row.lastChild.value = ok ? 100 : 0;
  }
}

if (token) { api("/api/albums").then(() => { $("login").style.display = "none"; $("app").style.display = "block"; showAlbums(); }).catch(showLogin); }
</script>
</body>
</html>
